name: Docker Build & Test

# Required permissions to publish to GHCR using GITHUB_TOKEN
permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t pyauthservice:test .

      - name: Run Django tests
        run: |
          docker run --rm pyauthservice:test bash -c "
            pip install -r requirements.txt &&
            DB_ENGINE=sqlite3 DEBUG=True python manage.py test users.test_login_view users.test_session_flow users.test_oidc_verify
          "

      - name: Check code quality
        run: |
          docker run --rm pyauthservice:test flake8 . || true

      - name: Scan for vulnerabilities (optional)
        run: |
          docker run --rm pyauthservice:test pip audit || true

  docker-push:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auth:latest
            ghcr.io/${{ github.repository_owner }}/auth:v${{ github.run_number }}

      - name: Create deployment notification
        run: |
          echo "✅ Deployment successful"
          echo "Image: ghcr.io/${{ github.repository_owner }}/auth:v${{ github.run_number }}"
