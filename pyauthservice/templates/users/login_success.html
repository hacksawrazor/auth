<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacksaw | Welcome</title>
<style>
  :root { --primary-color: {{ theme_color }}; }
  * { box-sizing: border-box; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); margin: 0; padding: 0; color: #111827; }
  .wrap { max-width: 640px; margin: 10vh auto 0; padding: 2rem; text-align: center; }
  h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 0.75rem; color: #111827; }
  p { font-size: 1.15rem; color: #6b7280; line-height: 1.65; margin-bottom: 1.25rem; }
  .tag { display: inline-block; padding: 0.35rem 0.75rem; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 9999px; background: #efe6fe; color: #7c3aed; }
</style>
</head>
<body>
<div class="wrap" role="main" aria-label="Login success">
  <h1>You're in.</h1>
  <p>The razor-sharp authentication service has verified you. No password was harmed in the making of this session - probably.</p>
  <p><span class="tag">Hacksaw Verified</span> · Session active </p>
</div>
</body>
</html>
