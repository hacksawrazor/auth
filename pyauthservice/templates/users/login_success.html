<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Successful — Auth Service</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  p { color: #374151; margin-bottom: 1.5rem; }
  .btn { display: inline-block; padding: 0.6rem 1.25rem; background: #4f46e5; color: #fff; text-decoration: none; border-radius: 0.5rem; font-weight: 600; }
  .btn:hover { background: #4338ca; }
</style>
</head>
<body>
<div class="card" role="main" aria-label="Login success">
  <h1>Welcome back</h1>
  <p>You have logged in successfully. You can return to the application or continue from the previous step.</p>
  <a class="btn" href="{% url 'user_login' %}" aria-label="Return to login">Back</a>
</div>
</body>
</html>
