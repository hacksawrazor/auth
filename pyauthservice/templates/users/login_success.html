<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20focusable%3D%22false%22%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22m19%209%201.25-2.75L23%205l-2.75-1.25L19%201l-1.25%202.75L15%205l2.75%201.25zm-7.5.5L9%204%206.5%209.5%201%2012l5.5%202.5L9%2020l2.5-5.5L17%2012zM19%2015l-1.25%202.75L15%2019l2.75%201.25L19%2023l1.25-2.75L23%2019l-2.75-1.25z%22%20fill%3D%22%23A78BFA%22%2F%3E%3C%2Fsvg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacksaw | Welcome</title>
<style>
  :root { --primary-color: {{ theme_color }}; }
  * { box-sizing: border-box; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); margin: 0; padding: 0; color: #111827; min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  body::before { content: ''; position: absolute; top: -10%; left: -10%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(167,139,250,0.12) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .wrap { max-width: 640px; padding: 3rem 2rem; text-align: center; position: relative; z-index: 1; }
  h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.035em; line-height: 1.1; margin-bottom: 0.75rem; color: #111827; }
  p { font-size: 1.15rem; color: #6b7280; line-height: 1.65; margin-bottom: 1.25rem; }
  .tag { display: inline-block; padding: 0.35rem 0.75rem; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 9999px; background: #efe6fe; color: #7c3aed; }
</style>
</head>
<body>
<div class="wrap" role="main" aria-label="Login success">
  <a href="https://hacksaw.in/" aria-label="Go to Hacksaw" style="display:inline-block;text-decoration:none;transition:transform 0.15s ease,box-shadow 0.15s ease;">
    <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20focusable%3D%22false%22%20aria-hidden%3D%22true%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22m19%209%201.25-2.75L23%205l-2.75-1.25L19%201l-1.25%202.75L15%205l2.75%201.25zm-7.5.5L9%204%206.5%209.5%201%2012l5.5%202.5L9%2020l2.5-5.5L17%2012zM19%2015l-1.25%202.75L15%2019l2.75%201.25L19%2023l1.25-2.75L23%2019l-2.75-1.25z%22%20fill%3D%22%23A78BFA%22%2F%3E%3C%2Fsvg%3E" alt="Hacksaw" style="width:72px;height:72px;margin-bottom:1rem;display:block;" aria-label="Logo">
  </a>
  <h1>You're in.</h1>
  <div style="width:48px;height:2px;background:linear-gradient(90deg,transparent,var(--primary-color),transparent);margin:0 auto 1.25rem;border-radius:2px;opacity:0.6;"></div>
  <p>The razor-sharp authentication service has verified you. No password was harmed in the making of this session - probably.</p>
  <p style="font-size:0.85rem;color:#9ca3af;margin-top:1.5rem;">Session established via OIDC. No tokens exposed to the page.</p>
  <p><span class="tag">Hacksaw Verified</span> · Session active </p>
  <div style="width:48px;height:2px;background:linear-gradient(90deg,transparent,var(--primary-color),transparent);margin:1.5rem auto 0;border-radius:2px;opacity:0.6;"></div>
  <p style="font-size:0.75rem;color:#9ca3af;margin-top:1rem;">Hacksaw Auth · Session-based authentication</p>
</div>
</body>
</html>
