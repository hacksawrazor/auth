<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }}</title>
<style>
  :root { --primary-color: {{ theme_color }}; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  p.subtitle { color: #6b7280; margin-bottom: 1.25rem; }
  .messages { margin-bottom: 1rem; }
  .messages .error { color: #dc2626; background: #fee2e2; padding: 0.5rem; border-radius: 0.375rem; }
  .messages .success { color: #166534; background: #dcfce7; padding: 0.5rem; border-radius: 0.375rem; }
  label { display: block; font-weight: 500; margin-bottom: 0.25rem; font-size: 0.875rem; }
  input[type="text"], input[type="password"] { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; margin-bottom: 1rem; }
  input:focus { outline: 2px solid #6366f1; border-color: #6366f1; }
  button { width: 100%; padding: 0.6rem; background: var(--primary-color); color: #fff; border: none; border-radius: 0.5rem; font-weight: 600; font-size: 1rem; cursor: pointer; }
  button:hover { background: #4338ca; }
  .socials { margin-top: 1rem; display: flex; gap: 0.5rem; }
  .socials a { flex: 1; text-align: center; padding: 0.5rem; border: 1px solid #e5e7eb; border-radius: 0.5rem; text-decoration: none; color: #374151; font-size: 0.875rem; background: #f9fafb; }
  .links { margin-top: 1rem; font-size: 0.875rem; display: flex; justify-content: space-between; }
  .links a { color: #4f46e5; text-decoration: none; }
</style>
</head>
<body>
<div class="card" role="main" aria-label="Login form">
  <h1>Sign in</h1>
  {% if logo_url %}<img src="{{ logo_url }}" alt="Logo" style="max-width:120px;display:block;margin:0 auto 1rem;" aria-label="App logo">{% endif %}
  <p class="subtitle">Access your account</p>

  {% if messages %}
  <div class="messages" aria-live="polite">
    {% for message in messages %}
      <div class="{% if message.tags %}{{ message.tags|join:' ' }}{% endif %}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% if error %}
  <div class="messages" aria-live="assertive"><div class="error">{{ error }}</div></div>
  {% endif %}
  {% if success %}
  <div class="messages" aria-live="polite"><div class="success">{{ success }}</div></div>
  {% endif %}

  <form method="post" action="{% url 'user_login' %}" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next|default:'/home/' }}">

    <label for="id_username">Username</label>
    <input id="id_username" type="text" name="username" autocomplete="username" required aria-required="true" placeholder="you@example.com">

    <label for="id_password">Password</label>
    <input id="id_password" type="password" name="password" autocomplete="current-password" required aria-required="true" placeholder="••••••••">

    <button type="submit">Sign in</button>
  </form>

</div>
</body>
</html>
